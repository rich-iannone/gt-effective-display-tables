name: Render and Publish

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rstudio/gt
            any::dplyr
            any::tidyr
            any::knitr
            any::rmarkdown
            any::hms
            any::downlit
            any::xml2
            any::gtsummary
            any::broom
            any::broom.helpers
            any::gtExtras
            any::svglite
            any::patchwork
            any::ggplot2

      - name: Patch and reinstall gtExtras (gt no longer exports %>%)
        run: |
          tmp <- tempdir()
          download.packages("gtExtras", destdir = tmp, type = "source")
          src <- list.files(tmp, pattern = "gtExtras.*\\.tar\\.gz", full.names = TRUE)
          untar(src, exdir = tmp)
          pkg_dir <- file.path(tmp, "gtExtras")
          ns_file <- file.path(pkg_dir, "NAMESPACE")
          ns <- readLines(ns_file)
          writeLines(ns[ns != 'importFrom(gt,"%>%")'], ns_file)
          install.packages(pkg_dir, repos = NULL, type = "source")
        shell: Rscript {0}

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: github.ref == 'refs/heads/main'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          # Upload entire repository
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4